<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C8AEFF">
<title>✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --c-purple: #C8AEFF;
    --c-mint:   #B1E9CB;
    --c-sky:    #BEDFF7;
    --c-pink:   #FFC7E9;
    --c-blue-deep: #3B82F6;
    --c-ink: #1a1147;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--c-ink);
    background: linear-gradient(135deg, var(--c-purple) 0%, var(--c-mint) 45%, var(--c-sky) 75%, var(--c-pink) 100%);
    background-size: 200% 200%;
    animation: shift 18s ease-in-out infinite;
  }

  @keyframes shift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* Holographic streaks like in the meme */
  body::before, body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    background:
      linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.4) 42%, transparent 55%),
      linear-gradient(115deg, transparent 60%, rgba(255,255,255,0.25) 70%, transparent 80%);
    mix-blend-mode: screen;
  }
  body::after {
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,0.45) 0 1px, transparent 2px),
      radial-gradient(circle at 88% 78%, rgba(255,255,255,0.45) 0 1px, transparent 2px),
      radial-gradient(circle at 22% 82%, rgba(255,255,255,0.35) 0 1px, transparent 2px),
      radial-gradient(circle at 78% 22%, rgba(255,255,255,0.45) 0 1px, transparent 2px);
  }

  /* Sparkles */
  .sparkle {
    position: fixed;
    z-index: 1;
    pointer-events: none;
    animation: twinkle 3s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
  }
  .sparkle svg { display: block; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; transform: scale(0.85) rotate(0deg); }
    50%      { opacity: 1;   transform: scale(1.15) rotate(20deg); }
  }
  .sp-1 { top: 8%;  left: 6%;  width: 56px; animation-delay: 0s; }
  .sp-2 { top: 18%; right: 8%; width: 42px; animation-delay: 0.6s; }
  .sp-3 { top: 62%; left: 4%;  width: 38px; animation-delay: 1.2s; }
  .sp-4 { top: 78%; right: 6%; width: 50px; animation-delay: 1.8s; }
  .sp-5 { top: 38%; right: 14%; width: 28px; animation-delay: 2.4s; }

  /* Faded star like in the meme */
  .ghost-star {
    position: fixed;
    top: 40%;
    right: -8%;
    width: 80vw;
    max-width: 600px;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
    transform: rotate(-12deg);
  }

  .main {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 22px max(40px, env(safe-area-inset-bottom));
    text-align: center;
  }

  .tag {
    font-family: 'Titan One', cursive;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.55);
    padding: 6px 14px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.9);
    color: var(--c-ink);
    margin-bottom: 28px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }

  .preamble {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: clamp(15px, 4.2vw, 19px);
    line-height: 1.35;
    color: var(--c-ink);
    opacity: 0.85;
    max-width: 22ch;
    margin-bottom: 14px;
    transform: rotate(-1deg);
    text-align: center;
  }

  h1 {
    font-family: 'Titan One', cursive;
    font-size: clamp(34px, 9.5vw, 56px);
    line-height: 0.98;
    letter-spacing: -0.015em;
    color: var(--c-ink);
    max-width: 14ch;
    margin-bottom: 4px;
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.4);
  }

  .vzdycky {
    display: inline-block;
    font-family: 'Titan One', cursive;
    font-size: clamp(56px, 15vw, 92px);
    line-height: 0.95;
    text-shadow: 0 3px 0 rgba(26,17,71,0.18);
    transform: rotate(-2deg);
    margin-top: 8px;
    -webkit-text-stroke: 1.5px var(--c-ink);
  }
  .vzdycky span {
    display: inline-block;
  }

  .sub {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--c-ink);
    margin: 36px 0 18px;
    opacity: 0.85;
  }

  .heart {
    -webkit-text-stroke: 0;
    font-size: clamp(56px, 15vw, 92px);
    line-height: 0.95;
    vertical-align: middle;
    display: inline-block;
  }

  .moc-rad {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: clamp(13px, 3.8vw, 17px);
    color: var(--c-ink);
    opacity: 0.75;
    margin-top: 8px;
    font-style: italic;
    transform: rotate(-1deg);
  }

  .cta-text {
    font-family: 'Titan One', cursive;
    font-size: clamp(13px, 3.8vw, 17px);
    line-height: 1.4;
    color: var(--c-ink);
    margin-top: 32px;
    transform: rotate(-1deg);
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.4);
    max-width: 30ch;
  }

  .ps {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: clamp(11px, 3vw, 13px);
    color: var(--c-ink);
    opacity: 0.65;
    margin-top: 36px;
    line-height: 1.4;
    max-width: 32ch;
  }

  .options-text {
    margin-top: 26px;
    font-family: 'Titan One', cursive;
    font-size: clamp(14px, 4vw, 17px);
    color: var(--c-blue-deep);
    letter-spacing: 0.04em;
    background: rgba(255,255,255,0.7);
    padding: 12px 22px;
    border-radius: 999px;
    border: 2px solid var(--c-ink);
    box-shadow: 0 4px 0 var(--c-ink);
    -webkit-text-stroke: 0.5px var(--c-blue-deep);
  }

  /* Confirmation state */
  .confirm {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(200, 174, 255, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .confirm.open { display: flex; animation: fade 0.3s ease; }
  .confirm-card {
    background: #fff;
    border: 3px solid var(--c-ink);
    border-radius: 24px;
    padding: 32px 28px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 10px 0 var(--c-ink);
    animation: pop 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .confirm-card h2 {
    font-family: 'Titan One', cursive;
    font-size: 30px;
    color: var(--c-blue-deep);
    margin-bottom: 12px;
    -webkit-text-stroke: 1.5px var(--c-blue-deep);
  }
  .confirm-card p {
    font-size: 15px;
    line-height: 1.5;
    color: var(--c-ink);
    font-weight: 600;
  }
  .confirm-card .pick {
    display: inline-block;
    margin-top: 12px;
    font-family: 'Titan One', cursive;
    font-size: 20px;
    color: var(--c-blue-deep);
  }
  @keyframes pop {
    0%   { transform: scale(0.5) rotate(-6deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes fade {
    from { opacity: 0; } to { opacity: 1; }
  }

  /* Rage-bait button */
  .ragebait {
    position: fixed;
    bottom: 28px;
    right: 22px;
    z-index: 5;
    font-family: 'Titan One', cursive;
    font-size: 17px;
    letter-spacing: 0.02em;
    background: var(--c-ink);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 16px 24px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.18);
    transition: left 0.32s cubic-bezier(.34,1.56,.64,1),
                top  0.32s cubic-bezier(.34,1.56,.64,1),
                background 0.2s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    animation: nudge 2.4s ease-in-out infinite;
  }
  @keyframes nudge {
    0%, 100% {
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 0 0 0 rgba(255,255,255,0.7);
    }
    50% {
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 0 0 14px rgba(255,255,255,0);
    }
  }
  .ragebait.moved {
    bottom: auto;
    right: auto;
    animation: none;
  }
  .ragebait:active { background: #2d1f6b; }

  /* Shake reaction when she taps */
  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    15%      { transform: translateX(-7px) rotate(-4deg); }
    30%      { transform: translateX(7px)  rotate(4deg); }
    45%      { transform: translateX(-5px) rotate(-3deg); }
    60%      { transform: translateX(5px)  rotate(3deg); }
    80%      { transform: translateX(-2px) rotate(-1deg); }
  }
  .ragebait.shake {
    animation: shake 0.4s ease-in-out !important;
  }

  /* Floating emoji that pops out where the button was */
  .pop-emoji {
    position: fixed;
    z-index: 6;
    font-size: 36px;
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: popOut 1.1s ease-out forwards;
  }
  @keyframes popOut {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(0deg); }
    20%  { opacity: 1; transform: translate(-50%, -90%) scale(1.4) rotate(-10deg); }
    100% { opacity: 0; transform: translate(-50%, -200%) scale(1) rotate(15deg); }
  }

  /* Reveal modal */
  .reveal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(26, 17, 71, 0.65);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .reveal.open { display: flex; animation: fade 0.3s ease; }
  .reveal-card {
    background: #fff;
    border: 3px solid var(--c-ink);
    border-radius: 24px;
    padding: 28px 24px 26px;
    text-align: center;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 10px 0 var(--c-ink);
    animation: pop 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .reveal-card .photo {
    width: 180px;
    height: 245px;
    border-radius: 14px;
    margin: 0 auto 20px;
    border: 3px solid var(--c-ink);
    object-fit: cover;
    object-position: center top;
    display: block;
    box-shadow: 0 6px 0 var(--c-ink);
    transform: rotate(-2.5deg);
    background: #000;
  }
  .reveal-card h2 {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--c-blue-deep);
    margin-bottom: 10px;
    line-height: 1.2;
  }
  .reveal-card p {
    font-size: 14px;
    color: var(--c-ink);
    font-weight: 600;
    line-height: 1.5;
  }
  .reveal-card .close {
    margin-top: 18px;
    background: var(--c-blue-deep);
    color: #fff;
    border: 2px solid var(--c-ink);
    border-radius: 14px;
    padding: 12px 22px;
    font-family: 'Titan One', cursive;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--c-ink);
  }
  .reveal-card .close:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 var(--c-ink);
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 14px;
    z-index: 15;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
  }
</style>
</head>
<body>

<!-- Background ghost star like in the meme -->
<svg class="ghost-star" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <path d="M100 10 L120 80 L195 90 L138 135 L155 195 L100 158 L45 195 L62 135 L5 90 L80 80 Z"
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" opacity="0.7"/>
</svg>

<!-- Scattered sparkles -->
<div class="sparkle sp-1">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#fff" stroke="#3B82F6" stroke-width="1"/>
  </svg>
</div>
<div class="sparkle sp-2">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#fff" stroke="#3B82F6" stroke-width="1"/>
  </svg>
</div>
<div class="sparkle sp-3">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#fff" stroke="#3B82F6" stroke-width="1"/>
  </svg>
</div>
<div class="sparkle sp-4">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#fff" stroke="#3B82F6" stroke-width="1"/>
  </svg>
</div>
<div class="sparkle sp-5">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#fff" stroke="#3B82F6" stroke-width="1"/>
  </svg>
</div>

<main class="main">
  <p class="preamble">ale prd, nic si rezervovat nemusíš, protože</p>

  <h1>
    na tebe si čas udělám<br>
    <span class="vzdycky"><span style="color:#E94560">v</span><span style="color:#FF7A1F">ž</span><span style="color:#FFC93D">d</span><span style="color:#6BCB77">y</span><span style="color:#3BB0F6">c</span><span style="color:#6A3DFF">k</span><span style="color:#C13DFF">y</span></span> <span class="heart">🫶</span>
  </h1>

  <p class="moc-rad">a moc rád</p>

  <p class="cta-text">tak dej vědět, kdy se ti to hodí,<br>a uvidíš, jakou kravinu jsem vymyslel xdd</p>

  <p class="ps">P.S.: na tuhle aktivitu bude ideální odpoledne/navečer</p>
</main>

<!-- Rage-bait button -->
<button class="ragebait" id="ragebait" type="button">nemačkej mě</button>

<!-- Reveal modal (after rage-bait) -->
<div class="reveal" id="reveal">
  <div class="reveal-card">
    <img class="photo" src="matylda.jpg" alt="výherkyně 🏆" />
    <h2>ok vyhrála jsi 🫶</h2>
    <p>tak mi rovnou napiš :)))</p>
    <button class="close" id="reveal-close">tak jo</button>
  </div>
</div>

<script>
  // ---------- RAGE-BAIT BUTTON ----------
  const rage = document.getElementById('ragebait');
  const revealEl = document.getElementById('reveal');
  const revealClose = document.getElementById('reveal-close');
  const messages = ['fakt nemačkej 🙄', 'no DOST 😤', 'POSLEDNÍ VAROVÁNÍ 💢'];
  const emojis   = ['🙄', '😤', '💢'];
  let taps = 0;

  function spawnEmoji(emoji) {
    const rect = rage.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'pop-emoji';
    el.textContent = emoji;
    el.style.left = (rect.left + rect.width / 2) + 'px';
    el.style.top  = (rect.top + rect.height / 2) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }

  function teleport() {
    const pad = 16;
    const w = window.innerWidth;
    const h = window.innerHeight;
    const bw = rage.offsetWidth;
    const bh = rage.offsetHeight;
    const maxX = w - bw - pad;
    const minY = pad + 60;
    const maxY = h - bh - pad - 20;

    const rect = rage.getBoundingClientRect();
    const cx = rect.left;
    const cy = rect.top;

    const minDist = Math.min(w, h) * 0.35;
    let x, y, dist;
    let tries = 0;
    do {
      x = pad + Math.random() * (maxX - pad);
      y = minY + Math.random() * (maxY - minY);
      dist = Math.hypot(x - cx, y - cy);
      tries++;
    } while (dist < minDist && tries < 12);

    rage.classList.add('moved');
    rage.style.left = x + 'px';
    rage.style.top  = y + 'px';
  }

  rage.addEventListener('click', (e) => {
    e.preventDefault();
    if (taps < 3) {
      spawnEmoji(emojis[taps]);
      rage.classList.add('shake');
      // Wait for shake to play, THEN teleport + change text
      setTimeout(() => {
        rage.classList.remove('shake');
        rage.textContent = messages[taps];
        teleport();
        taps++;
      }, 400);
    } else {
      revealEl.classList.add('open');
      rage.style.display = 'none';
    }
  });

  revealClose.addEventListener('click', () => {
    revealEl.classList.remove('open');
  });

  // Keep button in viewport on resize
  window.addEventListener('resize', () => {
    if (rage.classList.contains('moved')) teleport();
  });
</script>

</body>
</html>
