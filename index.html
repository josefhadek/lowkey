<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C8AEFF">
<title>✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --c-purple: #C8AEFF;
    --c-mint:   #B1E9CB;
    --c-sky:    #BEDFF7;
    --c-pink:   #FFC7E9;
    --c-blue-deep: #3B82F6;
    --c-ink: #1a1147;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--c-ink);
    background: linear-gradient(135deg, var(--c-purple) 0%, var(--c-mint) 45%, var(--c-sky) 75%, var(--c-pink) 100%);
    background-size: 200% 200%;
    animation: shift 18s ease-in-out infinite;
  }

  @keyframes shift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* Holographic streaks like in the meme */
  body::before, body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    background:
      linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.4) 42%, transparent 55%),
      linear-gradient(115deg, transparent 60%, rgba(255,255,255,0.25) 70%, transparent 80%);
    mix-blend-mode: screen;
  }
  body::after {
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,0.45) 0 1px, transparent 2px),
      radial-gradient(circle at 88% 78%, rgba(255,255,255,0.45) 0 1px, transparent 2px),
      radial-gradient(circle at 22% 82%, rgba(255,255,255,0.35) 0 1px, transparent 2px),
      radial-gradient(circle at 78% 22%, rgba(255,255,255,0.45) 0 1px, transparent 2px);
  }

  /* Sparkles */
  .sparkle {
    position: fixed;
    z-index: 1;
    pointer-events: none;
    animation: twinkle 3s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
  }
  .sparkle svg { display: block; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; transform: scale(0.85) rotate(0deg); }
    50%      { opacity: 1;   transform: scale(1.15) rotate(20deg); }
  }
  .sp-1 { top: 8%;  left: 6%;  width: 56px; animation-delay: 0s; }
  .sp-2 { top: 18%; right: 8%; width: 42px; animation-delay: 0.6s; }
  .sp-3 { top: 62%; left: 4%;  width: 38px; animation-delay: 1.2s; }
  .sp-4 { top: 78%; right: 6%; width: 50px; animation-delay: 1.8s; }
  .sp-5 { top: 38%; right: 14%; width: 28px; animation-delay: 2.4s; }

  /* Faded star like in the meme */
  .ghost-star {
    position: fixed;
    top: 40%;
    right: -8%;
    width: 80vw;
    max-width: 600px;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
    transform: rotate(-12deg);
  }

  .main {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 22px max(40px, env(safe-area-inset-bottom));
    text-align: center;
  }

  .tag {
    font-family: 'Titan One', cursive;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.55);
    padding: 6px 14px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.9);
    color: var(--c-ink);
    margin-bottom: 28px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }

  .preamble {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: clamp(15px, 4.2vw, 19px);
    line-height: 1.35;
    color: var(--c-ink);
    opacity: 0.85;
    max-width: 22ch;
    margin-bottom: 14px;
    transform: rotate(-1deg);
    text-align: center;
  }

  h1 {
    font-family: 'Titan One', cursive;
    font-size: clamp(34px, 9.5vw, 56px);
    line-height: 0.98;
    letter-spacing: -0.015em;
    color: var(--c-ink);
    max-width: 14ch;
    margin-bottom: 4px;
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.4);
  }

  .vzdycky {
    display: inline-block;
    font-family: 'Titan One', cursive;
    font-size: clamp(56px, 15vw, 92px);
    line-height: 0.95;
    text-shadow: 0 3px 0 rgba(26,17,71,0.18);
    transform: rotate(-2deg);
    margin-top: 8px;
    -webkit-text-stroke: 1.5px var(--c-ink);
  }
  .vzdycky span {
    display: inline-block;
  }

  .sub {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--c-ink);
    margin: 36px 0 18px;
    opacity: 0.85;
  }

  .heart {
    -webkit-text-stroke: 0;
    font-size: clamp(56px, 15vw, 92px);
    line-height: 0.95;
    vertical-align: middle;
    display: inline-block;
  }

  .moc-rad {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: clamp(13px, 3.8vw, 17px);
    color: var(--c-ink);
    opacity: 0.75;
    margin-top: 8px;
    font-style: italic;
    transform: rotate(-1deg);
  }

  .cta-text {
    font-family: 'Titan One', cursive;
    font-size: clamp(13px, 3.8vw, 17px);
    line-height: 1.4;
    color: var(--c-ink);
    margin-top: 32px;
    transform: rotate(-1deg);
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.4);
    max-width: 30ch;
  }

  .ps {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: clamp(11px, 3vw, 13px);
    color: var(--c-ink);
    opacity: 0.65;
    margin-top: 36px;
    line-height: 1.4;
    max-width: 32ch;
  }

  .options-text {
    margin-top: 26px;
    font-family: 'Titan One', cursive;
    font-size: clamp(14px, 4vw, 17px);
    color: var(--c-blue-deep);
    letter-spacing: 0.04em;
    background: rgba(255,255,255,0.7);
    padding: 12px 22px;
    border-radius: 999px;
    border: 2px solid var(--c-ink);
    box-shadow: 0 4px 0 var(--c-ink);
    -webkit-text-stroke: 0.5px var(--c-blue-deep);
  }

  /* Confirmation state */
  .confirm {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(200, 174, 255, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .confirm.open { display: flex; animation: fade 0.3s ease; }
  .confirm-card {
    background: #fff;
    border: 3px solid var(--c-ink);
    border-radius: 24px;
    padding: 32px 28px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 10px 0 var(--c-ink);
    animation: pop 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .confirm-card h2 {
    font-family: 'Titan One', cursive;
    font-size: 30px;
    color: var(--c-blue-deep);
    margin-bottom: 12px;
    -webkit-text-stroke: 1.5px var(--c-blue-deep);
  }
  .confirm-card p {
    font-size: 15px;
    line-height: 1.5;
    color: var(--c-ink);
    font-weight: 600;
  }
  .confirm-card .pick {
    display: inline-block;
    margin-top: 12px;
    font-family: 'Titan One', cursive;
    font-size: 20px;
    color: var(--c-blue-deep);
  }
  @keyframes pop {
    0%   { transform: scale(0.5) rotate(-6deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes fade {
    from { opacity: 0; } to { opacity: 1; }
  }

  /* Floating action button — links to cards */
  .card-fab {
    position: fixed;
    bottom: 28px;
    right: 22px;
    z-index: 5;
    font-family: 'Titan One', cursive;
    font-size: 17px;
    letter-spacing: 0.02em;
    background: var(--c-ink);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    padding: 16px 24px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.18);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    animation: nudge 2.4s ease-in-out infinite;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  @keyframes nudge {
    0%, 100% {
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 0 0 0 rgba(255,255,255,0.7);
    }
    50% {
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 0 0 14px rgba(255,255,255,0);
    }
  }
  .card-fab:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 rgba(0,0,0,0.18);
  }

  /* Confetti (still used by date pick if reused) */
  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 14px;
    z-index: 15;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
  }
</style>
</head>
<body>
